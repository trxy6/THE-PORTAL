<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fd9c7" stop-opacity="1" />
      <stop offset="60%" stop-color="#cf4fe6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0e061c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fd9c7" />
      <stop offset="50%" stop-color="#cf4fe6" />
      <stop offset="100%" stop-color="#faebd7" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0e061c" />
  <!-- Portal Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#portalGlow)" />
  <!-- Magical Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-dasharray="20 10 5 10" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-dasharray="10 30" />
  <!-- Core Rift Symbol (Rune-like/Star) -->
  <polygon points="256,90 296,216 422,256 296,296 256,422 216,296 90,256 216,216" fill="#ffffff" opacity="0.9" />
  <circle cx="256" cy="256" r="32" fill="#3fd9c7" />
</svg>
