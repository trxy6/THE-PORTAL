<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Craive - AI Food Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      @keyframes moveBackground {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: -200px -200px;
        }
      }
      body {
        font-family: 'Quicksand', sans-serif;
      }
      .auth-background {
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><path d="M10 10 C 20 20, 40 20, 50 10" stroke="%23E2C792" fill="transparent" stroke-width="0.5"/><path d="M70 15 C 80 25, 90 25, 95 15" stroke="%23E2C792" fill="transparent" stroke-width="0.5"/><path d="M15 30 L 25 50 L 5 50 Z" stroke="%23E2C792" fill="transparent" stroke-width="0.5"/><path d="M60 40 C 70 50, 80 50, 90 40" stroke="%23E2C792" fill="transparent" stroke-width="0.5" /><circle cx="80" cy="70" r="8" stroke="%23E2C792" fill="transparent" stroke-width="0.5"/><path d="M20 70 Q 30 60 40 70 T 60 70" stroke="%23E2C792" fill="transparent" stroke-width="0.5"/></svg>');
        background-repeat: repeat;
        background-size: 200px;
        opacity: 0.5;
        animation: moveBackground 30s linear infinite;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'cream': '#FDF8F0',
              'deep-green': '#0A2E28',
              'gold': '#C5A46D',
              'gold-light': '#E2C792',
            },
            fontFamily: {
              sans: ['Quicksand', 'sans-serif'],
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              shimmer: {
                '0%, 100%': { 'background-position': '-200% 0' },
                '50%': { 'background-position': '200% 0' },
              },
              slideOutUp: {
                '0%': { transform: 'translateY(0)', opacity: '1' },
                '100%': { transform: 'translateY(-100%)', opacity: '0' },
              },
              spin: {
                'from': { transform: 'rotate(0deg)' },
                'to': { transform: 'rotate(360deg)' },
              },
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
              'shimmer': 'shimmer 2.5s linear infinite',
              'slide-out-up': 'slideOutUp 0.7s ease-in-out forwards',
              'spin': 'spin 1s linear infinite',
            },
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

  </body>
</html>
